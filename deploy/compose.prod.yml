# KaryaKita production / staging stack: caddy (TLS) -> web (Next.js) -> api (Go) -> db (Postgres),
# plus a nightly backup job. Run from the BACKEND repo root, see deploy/README.md:
#
#   docker compose --env-file .env.production -f deploy/compose.prod.yml up -d --build
#   docker compose -p karyakita-staging --env-file .env.staging -f deploy/compose.prod.yml up -d --build
#
# Layout on the server: /srv/karyakita/backend (this repo) + /srv/karyakita/frontend.
# Everything is configured through the --env-file (deploy/.env.production.example lists it all).
# A variable that is not named in an `environment:` block below never reaches the container,
# so a new API env var must be added to `api.environment` here as well.

name: karyakita

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  # Public entrypoint: the only service with published ports. Runs in the stack that owns
  # ports 80/443 (profile "edge", enabled through COMPOSE_PROFILES=edge in .env.production).
  # Staging on the same server does NOT start its own caddy: the production caddy serves it
  # through the shared `karyakita-edge` network (see deploy/README.md, "Staging").
  caddy:
    image: caddy:2-alpine
    profiles: ["edge"]
    restart: unless-stopped
    logging: *logging
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL}
      WEB_UPSTREAM: web-${STACK:-prod}:3000
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/extra:/etc/caddy/extra:ro
      - caddy_data:/data # certificates + ACME account: keep this volume
      - caddy_config:/config
    networks: [edge]
    depends_on:
      web:
        condition: service_healthy

  web:
    build:
      context: ${FRONTEND_DIR:-../../frontend}
      args:
        # next.config.ts bakes these in at build time
        API_URL: http://api:8081
        FILES_ORIGIN: ${FILES_ORIGIN:-}
        SITE_URL: https://${DOMAIN:?set DOMAIN}
    restart: unless-stopped
    logging: *logging
    environment:
      NODE_ENV: production
      API_URL: http://api:8081
      SITE_URL: https://${DOMAIN}
      FILES_ORIGIN: ${FILES_ORIGIN:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/login"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      api:
        condition: service_healthy
    networks:
      default: {}
      edge:
        # unique per stack: prod and staging share the edge network, so plain "web" would be ambiguous
        aliases: ["web-${STACK:-prod}"]

  api:
    build:
      context: ..
    restart: unless-stopped
    logging: *logging
    environment:
      APP_ENV: ${APP_ENV:-production}
      PORT: "8081"
      DATABASE_URL: postgres://karyakita:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/karyakita?sslmode=disable
      UPLOAD_DIR: /data/uploads
      APP_URL: https://${DOMAIN}
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-2} # caddy -> next -> api
      ADMIN_NOTIFY_EMAIL: ${ADMIN_NOTIFY_EMAIL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-KaryaKita <no-reply@karyakita.id>}
      MIDTRANS_SERVER_KEY: ${MIDTRANS_SERVER_KEY:-}
      MIDTRANS_CLIENT_KEY: ${MIDTRANS_CLIENT_KEY:-}
      MIDTRANS_ENV: ${MIDTRANS_ENV:-production}
      MIDTRANS_ENABLED_PAYMENTS: ${MIDTRANS_ENABLED_PAYMENTS:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URL: https://${DOMAIN}/api/auth/google/callback
      BITESHIP_API_KEY: ${BITESHIP_API_KEY:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-auto}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      FILES_PUBLIC_URL: ${FILES_PUBLIC_URL:-}
    volumes:
      - uploads:/data/uploads
    healthcheck:
      # distroless: no shell or curl, so a tiny binary built into the image
      test: ["CMD", "/healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s # migrations + search reindex on boot
    depends_on:
      db:
        condition: service_healthy
    networks: [default]

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *logging
    # no "ports:": reachable only from this project's network
    environment:
      POSTGRES_USER: karyakita
      POSTGRES_DB: karyakita
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U karyakita -d karyakita"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [default]

  # Nightly pg_dump -Fc to an S3-compatible bucket (Cloudflare R2) via rclone;
  # keeps 14 daily + 8 weekly dumps. BACKUP_REMOTE=/backups writes to the local-dir volume (tests).
  backup:
    build:
      context: ./backup
    restart: unless-stopped
    logging: *logging
    environment:
      PGHOST: db
      PGUSER: karyakita
      PGDATABASE: karyakita
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_REMOTE: ${BACKUP_REMOTE:-backup:${BACKUP_BUCKET:-karyakita-backups}/${STACK:-prod}}
      BACKUP_HOUR_UTC: ${BACKUP_HOUR_UTC:-19} # 19:00 UTC = 02:00 WIB
      BACKUP_KEEP_DAILY: ${BACKUP_KEEP_DAILY:-14}
      BACKUP_KEEP_WEEKLY: ${BACKUP_KEEP_WEEKLY:-8}
      BACKUP_PING_URL: ${BACKUP_PING_URL:-}
      # rclone remote "backup", configured entirely from env
      RCLONE_CONFIG_BACKUP_TYPE: s3
      RCLONE_CONFIG_BACKUP_PROVIDER: ${BACKUP_S3_PROVIDER:-Cloudflare}
      RCLONE_CONFIG_BACKUP_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      RCLONE_CONFIG_BACKUP_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:-}
      RCLONE_CONFIG_BACKUP_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:-}
      RCLONE_CONFIG_BACKUP_ACL: private
      RCLONE_CONFIG_BACKUP_NO_CHECK_BUCKET: "true" # object-scoped R2 tokens cannot create buckets
    volumes:
      - ${BACKUP_LOCAL_DIR:-backup-local}:/backups
    depends_on:
      db:
        condition: service_healthy
    networks: [default]

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
  backup-local:

networks:
  default: {}
  # Shared by the production caddy and the web service of every stack (prod + staging).
  # Create it once on the server: docker network create karyakita-edge
  edge:
    name: karyakita-edge
    external: true
