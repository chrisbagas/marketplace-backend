services:
  db:
    image: postgres:16-alpine
    container_name: karyakita-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: karyakita
      POSTGRES_PASSWORD: karyakita_dev
      POSTGRES_DB: karyakita
    ports:
      - "5432:5432"
    volumes:
      - karyakita-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U karyakita -d karyakita"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Kotak masuk email untuk dev: semua email (verifikasi, reset password)
  # tertangkap di sini dan tidak pernah sampai ke penerima sungguhan.
  # Buka http://localhost:8025 — API mengirim lewat SMTP localhost:1025.
  mail:
    image: axllent/mailpit:latest
    container_name: karyakita-mail
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  karyakita-pgdata:
