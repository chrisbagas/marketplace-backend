name: CI

on:
  pull_request:
    branches: [staging, main]
  push:
    branches: [staging]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (vet + test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: karyakita
          POSTGRES_PASSWORD: karyakita_dev
          POSTGRES_DB: karyakita_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U karyakita -d karyakita_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://karyakita:karyakita_dev@localhost:5432/karyakita_test?sslmode=disable
      TEST_DATABASE_URL: postgres://karyakita:karyakita_dev@localhost:5432/karyakita_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      # The DB tests need a migrated + seeded database. The API applies the
      # migrations and seeds on start and only listens afterwards, so a healthy
      # /healthz means the database is ready. Then we stop it.
      - name: Migrate and seed the test database
        run: |
          set -euo pipefail
          go build -o "$RUNNER_TEMP/api" ./cmd/api
          UPLOAD_DIR="$RUNNER_TEMP/uploads" PORT=8081 "$RUNNER_TEMP/api" > "$RUNNER_TEMP/api.log" 2>&1 &
          api_pid=$!
          ready=0
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:8081/healthz > /dev/null 2>&1; then ready=1; break; fi
            if ! kill -0 "$api_pid" 2> /dev/null; then break; fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "API did not become healthy; log:"
            cat "$RUNNER_TEMP/api.log"
            exit 1
          fi
          kill "$api_pid"
          wait "$api_pid" || true

      - name: go test
        run: |
          set -euo pipefail
          go test -count=1 -v ./... 2>&1 | tee "$RUNNER_TEMP/test.log"
          # DB tests skip themselves when TEST_DATABASE_URL is missing or the
          # database is unreachable; a skip here would hide a broken setup.
          if grep -E -- '^\s*--- SKIP' "$RUNNER_TEMP/test.log"; then
            echo "::error::Some tests were skipped; the database tests must run in CI"
            exit 1
          fi
